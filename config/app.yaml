# The chatbot's settings (C-033): base + the decisions from the level checks, so the chatbot is what we score.
# The final benchmark run uses these same settings (its experiment file repeats them).

docs: [nhm_hrh_2022]
query:
  front_end: rewrite_if_unknown   # C-032: Gemini rewrite only for questions with unknown words
gate:
  m_action: answer                # C-027/C-028: M goes to the LLM with its evidence
  p_notes: false                  # C-025: P notes carried no information
  re_retrieve: false              # C-025: the second search changed nothing
chat:
  model: gemini:gemini-3.5-flash-lite   # E2/E3 choice
  version: v3b_med                      # prompts.VERSIONS (E2 choice)
  format: f0p                           # prompts.FORMATS (C-014)
  clarify: false                        # true = ask one clarifying question when the hits disagree (one more LLM call
                                        # per short or P question; E3 scored the answer without it)
  sessions: data/chat/sessions          # one JSON file per conversation (data/ is not in git)
  log: data/chat/questions.csv          # question log: one row per question, to measure repeats later